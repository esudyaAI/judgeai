server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Hashed Vite assets are immutable; everything else falls back to index.html.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # pdf.js loads its worker as an ES module, which browsers accept only with a JavaScript
    # MIME type; the stock mime.types of nginx maps .mjs to application/octet-stream.
    location /pdfjs/ {
        types {
            text/javascript js mjs;
            application/wasm wasm;
        }
        default_type application/octet-stream;
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
