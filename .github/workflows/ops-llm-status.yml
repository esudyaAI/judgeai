# Read-only check of how the language model is wired on the production server.
# Prints container names/images, docker networks of a DeepSeek proxy if one runs, and the
# non-secret LLM_* settings from /opt/judgeai/.env. LLM_API_KEY is never printed: only
# whether it is set, makes one tiny test call to the model (prints only the answer keys or the
# error), and shows the last api log lines about analyses and LLM calls with tokens
# masked (no document texts are logged). Runs by hand (Actions -> ops-llm-status -> Run workflow).
name: ops-llm-status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    env:
      DEPLOY_DIR: /opt/judgeai
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/deploy_key
      - name: LLM status on the server
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          cd /opt/judgeai || exit 1
          echo "== containers"
          docker ps --format '{{.Names}}  {{.Image}}  {{.Status}}'
          echo "== deepseek-like containers: networks and exposed ports"
          for c in $(docker ps --format '{{.Names}}' | grep -i -E 'deepseek|proxy|llm' | grep -v caddy); do
            echo "$c networks: $(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' "$c")"
            echo "$c exposed: $(docker inspect -f '{{range $p, $v := .Config.ExposedPorts}}{{$p}} {{end}}' "$c")"
          done
          echo "== LLM settings in .env (no secrets)"
          grep -E '^(LLM_PROVIDER|LLM_API_BASE|LLM_MODEL|LLM_ALLOW_FAKE|LLM_TIMEOUT_SECONDS)=' .env || echo "(none)"
          if grep -q -E '^LLM_API_KEY=.+' .env; then echo "LLM_API_KEY: set"; else echo "LLM_API_KEY: empty"; fi
          echo "== api container view"
          docker exec judgeai_api python -c "from src.config import settings as s; print('provider', s.LLM_PROVIDER, 'base_host', s.LLM_API_BASE.split('/')[2] if '//' in s.LLM_API_BASE else s.LLM_API_BASE, 'model', s.LLM_MODEL)"
          echo "== api log, last 40 minutes: analysis stages, LLM calls, errors (secrets masked)"
          docker logs --timestamps --since 40m judgeai_api 2>&1 \
            | grep -i -E 'analysis|llm|error|exception|traceback|timeout|httpx|POST /api' \
            | sed -E 's/(sk-|Bearer )[A-Za-z0-9._-]+/\1***/g' \
            | tail -80
          echo "== embeddings: settings (no key) and vectors per model"
          grep -E '^(EMBEDDING_PROVIDER|EMBEDDING_MODEL|EMBEDDING_DIM)=' .env || echo "(defaults)"
          if grep -q -E '^JINA_API_KEY=.+' .env; then echo "JINA_API_KEY: set"; else echo "JINA_API_KEY: empty"; fi
          docker ps -a --format '{{.Names}}  {{.Status}}' | grep -i 'run' || echo "(no one-off containers)"
          docker exec judgeai_db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | " -c "select count(*) as cards from precedent_cards" -c "select model, count(*) from precedent_embeddings group by model" -c "select coalesce(embedding_model, chr(45)), count(*) from knowledge_chunks group by 1"'
          docker exec judgeai_api python -c "from src.config import settings as s; print('effective', s.EMBEDDING_PROVIDER, s.EMBEDDING_MODEL, s.EMBEDDING_DIM)"
          echo "== precedent cards: punishment recognition"
          docker exec judgeai_db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -At -F " | " -c "select count(*) as total, count(*) filter (where jsonb_typeof(final) = \$\$object\$\$ or (jsonb_array_length(episodes) = 1 and jsonb_typeof(episodes->0->\$\$punishment\$\$) = \$\$object\$\$)) as recognized, count(imprisonment_months) as with_months from precedent_cards" -c "select extractor_version, count(distinct card_id) from precedent_card_fields group by 1 order by 1"'
          echo "== host resources"
          nproc; free -m; df -h / | tail -1
          docker stats --no-stream --format "{{.Name}} {{.MemUsage}}" judgeai_api judgeai_db
          echo "== api restarts"
          docker inspect -f 'started {{.State.StartedAt}} restarts {{.RestartCount}}' judgeai_api
          echo "== smoke call through the api's own client (prints only keys or the error text)"
          docker exec -i judgeai_api python - <<'PY'
          import asyncio, time
          from src.services.llm_client import LLMError, get_llm_client

          async def main():
              started = time.monotonic()
              try:
                  data = await get_llm_client().complete_json(
                      'Верни JSON-объект {"ok": true, "answer": <число>}.', "Сколько будет 2+2?"
                  )
              except LLMError as exc:
                  print("LLM ERROR:", exc)
                  return
              print("LLM OK in", round(time.monotonic() - started, 1), "s; keys:", sorted(data))
              print("answer:", data.get("answer"))

          asyncio.run(main())
          PY
          REMOTE
