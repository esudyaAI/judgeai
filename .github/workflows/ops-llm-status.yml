# Read-only check of how the language model is wired on the production server.
# Prints container names/images, docker networks of a DeepSeek proxy if one runs, and the
# non-secret LLM_* settings from /opt/judgeai/.env. LLM_API_KEY is never printed: only
# whether it is set, makes one tiny test call to the model (prints only the answer keys or the
# error), and shows the last api log lines about analyses and LLM calls with tokens
# masked (no document texts are logged). Runs by hand (Actions -> ops-llm-status -> Run workflow).
name: ops-llm-status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production
    env:
      DEPLOY_DIR: /opt/judgeai
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
    steps:
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key)
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          ssh-add ~/.ssh/deploy_key
      - name: Read-only deployment disk diagnostics
        run: |
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -s' <<'REMOTE'
          set -eu
          cd /opt/judgeai
          echo 'Filesystem capacity'
          df -h /
          df -i /
          echo 'Docker storage accounting'
          docker system df
          echo 'Running container images'
          docker ps --format '{{.Image}}'
          echo 'Local image inventory'
          docker image ls --format '{{.ID}} {{.Repository}}:{{.Tag}} {{.CreatedAt}} {{.Size}}'
          echo 'Backup directory size'
          du -sh backups
          echo 'Backup file counts and sizes'
          find backups -maxdepth 1 -type f -printf '%f %s bytes\n'
          REMOTE
